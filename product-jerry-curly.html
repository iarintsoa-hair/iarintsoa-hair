<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta http-equiv="refresh" content="0; url=product.html?id=jerry-curly-hd-lace">
    <title>Redirection vers la fiche produit — IARINTSOA Hair</title>
    <link rel="icon" type="image/svg+xml" href="image/logo-transparent.svg">
    <link rel="icon" type="image/png" href="image/logo.png">
</head>
<body>
    <p>La fiche produit a changé d’adresse. <a href="product.html?id=jerry-curly-hd-lace">Continuer vers Jerry Curly HD Lace</a>.</p>
    <script>
        const productId = new URLSearchParams(window.location.search).get("id") || "jerry-curly-hd-lace";
        const destination = new URL("product.html", window.location.href);
        destination.searchParams.set("id", productId);
        window.location.replace(destination.href);
    </script>
</body>
</html>
